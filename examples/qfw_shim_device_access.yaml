qpus:
  ornl-iqm-20q:
    provider: iqm
    provider-device-id: default
    url: https://qccsw.ccs.ornl.gov/
    credential-provider: shim-no-secret
  # Amazon Braket's SV1 simulator through QDMI. The device ARN is the
  # provider-device-id, the stable QDMI id names the device library's
  # catalogue entry, and the AWS identity comes from the service process's
  # AWS SDK credential chain (AWS_PROFILE and friends), not from QFw, so
  # the no-secret provider is right for this smoke. The library ignores
  # url; select_qpu requires one.
  aws-sv1:
    provider: aws
    provider-device-id: arn:aws:braket:::device/quantum-simulator/amazon/sv1
    qdmi-device-id: amazon.braket.sv1
    aws-region: us-east-1
    url: https://braket.us-east-1.amazonaws.com
    num-qubits: 34
    credential-provider: shim-no-secret
    libraries:
      - qdmi
    preference: qdmi
    execution-owner: qdmi

  # Rigetti's Cepheus-1-108Q through Braket, in us-west-1: a real QPU,
  # billed per task and per shot. max-shots refuses a larger request before
  # a task exists, and job-timeout-seconds is how long a queued task is
  # waited for before it is cancelled. A site sets s3-results-uri to its own
  # bucket for the task results; Braket wants it in the device's Region, and
  # AmazonBraketFullAccess covers buckets named amazon-braket-*. Without it
  # the library creates a default bucket, which needs S3 permissions the
  # Braket policy alone does not grant.
  aws-cepheus:
    provider: aws
    provider-device-id: arn:aws:braket:us-west-1::device/qpu/rigetti/Cepheus-1-108Q
    qdmi-device-id: amazon.braket.rigetti.cepheus-1-108q
    aws-region: us-west-1
    # s3-results-uri: s3://amazon-braket-<your-bucket>/qfw/cepheus
    url: https://braket.us-west-1.amazonaws.com
    num-qubits: 108
    max-shots: 1024
    job-timeout-seconds: 1800
    credential-provider: shim-no-secret
    libraries:
      - qdmi
    preference: qdmi
    execution-owner: qdmi

credential-providers:
  shim-no-secret:
    type: no-secret
